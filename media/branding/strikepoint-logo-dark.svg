<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 180" width="1060" height="180">
  <defs>
    <!-- Live Multi-Stop Neon Gradients -->
    <linearGradient id="crestNeonDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="50%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#38EF7D" />
    </linearGradient>

    <linearGradient id="troughNeonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3860" />
      <stop offset="50%" stop-color="#FF1361" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Full Traveling Pulse Gradient: Green at start to Red at end -->
    <linearGradient id="liveWaveGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="42%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="58%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#FF1361" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="particleGlowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="pBlur" />
      <feMerge>
        <feMergeNode in="pBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Underglow Fills -->
    <linearGradient id="crestAuraDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="troughAuraDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1361" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#FF1361" stop-opacity="0.32" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseAuraDark {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes liveTrailDark {
      0% {
        stroke-dashoffset: 400;
        opacity: 0.3;
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: -80;
        opacity: 0.2;
      }
    }
    .aura-bg-dark {
      animation: pulseAuraDark 3s ease-in-out infinite;
    }
    .sweep-trail-dark {
      stroke-dasharray: 90 320;
      animation: liveTrailDark 2.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- WAVE GRAPHICS GROUP -->
  <g id="sine-wave-mark-dark">
    <!-- Ambient Soft Underglow -->
    <path class="aura-bg-dark" d="M 30 90 C 74.5 4, 115.5 4, 160 90 Z" fill="url(#crestAuraDark)" />
    <path class="aura-bg-dark" d="M 160 90 C 204.5 176, 245.5 176, 290 90 Z" fill="url(#troughAuraDark)" />

    <!-- Sleek Subtle Baseline Axis Line -->
    <line x1="20" y1="90" x2="300" y2="90" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" stroke-dasharray="3 4" />

    <!-- Base Track: Green Upper Half (Start to Zero) -->
    <path d="M 30 90 C 74.5 4, 115.5 4, 160 90" 
          fill="none" 
          stroke="url(#crestNeonDark)" 
          stroke-width="7" 
          stroke-linecap="round"
          filter="url(#neonGlowDark)" />

    <!-- Base Track: Red Lower Half (Zero to End) -->
    <path d="M 160 90 C 204.5 176, 245.5 176, 290 90" 
          fill="none" 
          stroke="url(#troughNeonDark)" 
          stroke-width="7" 
          stroke-linecap="round"
          filter="url(#neonGlowDark)" />

    <!-- LIVE TRAVELING ENERGY BEAM -->
    <path class="sweep-trail-dark"
          d="M 30 90 C 74.5 4, 115.5 4, 160 90 C 204.5 176, 245.5 176, 290 90"
          fill="none"
          stroke="url(#liveWaveGradDark)"
          stroke-width="10"
          stroke-linecap="round"
          filter="url(#neonGlowDark)" />

    <!-- LIVE TRAVELING TRACER PARTICLE -->
    <g>
      <!-- Outer Pulsing Halo -->
      <circle r="9" opacity="0.75">
        <animateMotion path="M 30 90 C 74.5 4, 115.5 4, 160 90 C 204.5 176, 245.5 176, 290 90" 
                       dur="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1" />
        <animate attributeName="fill" 
                 values="#00F5A0;#00F5A0;#10B981;#F59E0B;#EF4444;#FF1361;#FF1361" 
                 keyTimes="0;0.25;0.45;0.52;0.7;0.9;1" dur="2.6s" repeatCount="indefinite" />
        <animate attributeName="r" values="7;12;7" dur="1.3s" repeatCount="indefinite" />
      </circle>

      <!-- Inner High-Intensity Particle Core -->
      <circle r="4.5" fill="#FFFFFF" filter="url(#particleGlowDark)">
        <animateMotion path="M 30 90 C 74.5 4, 115.5 4, 160 90 C 204.5 176, 245.5 176, 290 90" 
                       dur="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1" />
      </circle>
    </g>

    <!-- Crest Fixed Quant Indicator -->
    <circle cx="95" cy="26" r="3.5" fill="#00F5A0" />
    <circle cx="95" cy="26" r="7" fill="none" stroke="#00F5A0" stroke-width="1" opacity="0.6" />

    <!-- Trough Fixed Quant Indicator -->
    <circle cx="225" cy="154" r="3.5" fill="#FF1361" />
    <circle cx="225" cy="154" r="7" fill="none" stroke="#FF1361" stroke-width="1" opacity="0.6" />

    <!-- Center Zero-Crossing Node -->
    <circle cx="160" cy="90" r="3" fill="#D7B231" opacity="0.8" />
  </g>

  <!-- ELEGANT VERTICAL SEPARATOR -->
  <line x1="335" y1="26" x2="335" y2="154" stroke="rgba(255,255,255,0.22)" stroke-width="1.8" />
  <circle cx="335" cy="90" r="2.5" fill="#D7B231" />

  <!-- BRAND TYPOGRAPHY FOR DARK BACKGROUND -->
  <g id="brand-text-dark">
    <text x="375" y="98" 
          font-family="'Fraunces', Georgia, serif" 
          font-weight="700" 
          font-size="68" 
          letter-spacing="5" 
          fill="#FFFFFF">STRIKEPOINT</text>

    <text x="380" y="144" 
          font-family="'Hanken Grotesk', system-ui, sans-serif" 
          font-weight="600" 
          font-size="28" 
          letter-spacing="14" 
          fill="#D7B231">VENTURES</text>
  </g>
</svg>
