<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 180" width="1120" height="180">
  <defs>
    <!-- Seamless Gradient: Vibrant Trading Green on UP, Vibrant Risk Red on DOWN -->
    <linearGradient id="liveWaveGrad" x1="30" y1="90" x2="290" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="44%" stop-color="#00F5A0" />
      <stop offset="49.8%" stop-color="#10B981" />
      <stop offset="50.2%" stop-color="#EF4444" />
      <stop offset="56%" stop-color="#FF3860" />
      <stop offset="100%" stop-color="#FF1361" />
    </linearGradient>
  </defs>

  <!-- WAVE GRAPHICS GROUP (NO EQUATOR GRID, NO DOTS, PURE CLEAN LIVE WAVE) -->
  <g id="sine-wave-mark">
    <!-- SINGLE PLAIN SINE WAVE LINE: Green pulses UP, Red pulses DOWN -->
    <path fill="none" 
          stroke="url(#liveWaveGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round">
      <animate attributeName="d" 
        dur="2.8s" 
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.25; 0.5; 0.75; 1"
        keySplines="0.45 0 0.25 1; 0.45 0 0.25 1; 0.45 0 0.25 1; 0.45 0 0.25 1"
        values="
          M 30 90 C 76 44, 114 44, 160 90 C 206 136, 244 136, 290 90;
          M 30 90 C 68 20, 110 30, 160 90 C 202 160, 244 150, 290 90;
          M 30 90 C 74 12, 116 12, 160 90 C 204 168, 246 168, 290 90;
          M 30 90 C 80 30, 122 20, 160 90 C 210 150, 252 160, 290 90;
          M 30 90 C 76 44, 114 44, 160 90 C 206 136, 244 136, 290 90
        " />
    </path>
  </g>

  <!-- CLEAN SLEEK VERTICAL SEPARATOR (NO DOTS) -->
  <line x1="335" y1="28" x2="335" y2="152" stroke="rgba(11,31,58,0.18)" stroke-width="1.8" stroke-linecap="round" />

  <!-- BRAND TYPOGRAPHY -->
  <g id="brand-text">
    <text x="375" y="98" 
          font-family="'Fraunces', Georgia, serif" 
          font-weight="700" 
          font-size="66" 
          letter-spacing="4.5" 
          fill="#0B1F3A">STRIKEPOINT</text>

    <text x="380" y="144" 
          font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" 
          font-weight="600" 
          font-size="28" 
          letter-spacing="14" 
          fill="#C29B40">VENTURES</text>
  </g>
</svg>
