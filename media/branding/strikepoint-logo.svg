<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 180" width="1040" height="180">
  <defs>
    <!-- Green Gradient for Crest -->
    <linearGradient id="crestGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Red Gradient for Trough -->
    <linearGradient id="troughGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>

    <!-- Subtle glow filters -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#EF4444" flood-opacity="0.35"/>
    </filter>

    <!-- Subtle under-curve area fills for depth -->
    <linearGradient id="crestArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="troughArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <!-- SINE WAVE ICON GROUP -->
  <g id="sine-wave-mark">
    <!-- Subtle Area Fill under Crest (Positive) -->
    <path d="M 30 90 C 74.5 10, 115.5 10, 160 90 Z" fill="url(#crestArea)" />

    <!-- Subtle Area Fill over Trough (Negative) -->
    <path d="M 160 90 C 204.5 170, 245.5 170, 290 90 Z" fill="url(#troughArea)" />

    <!-- Pure Sine Wave: Green Upper Half (Positive Cycle) -->
    <path d="M 30 90 C 74.5 10, 115.5 10, 160 90" 
          fill="none" 
          stroke="url(#crestGrad)" 
          stroke-width="8.5" 
          stroke-linecap="round"
          filter="url(#greenGlow)" />

    <!-- Pure Sine Wave: Red Lower Half (Negative Cycle) -->
    <path d="M 160 90 C 204.5 170, 245.5 170, 290 90" 
          fill="none" 
          stroke="url(#troughGrad)" 
          stroke-width="8.5" 
          stroke-linecap="round"
          filter="url(#redGlow)" />

    <!-- Peak Indicator Dot (Quant Bullish Edge) -->
    <circle cx="95" cy="30" r="4.5" fill="#34D399" />
    <circle cx="95" cy="30" r="8" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5" />

    <!-- Trough Indicator Dot (Quant Value Reversal) -->
    <circle cx="225" cy="150" r="4.5" fill="#F87171" />
    <circle cx="225" cy="150" r="8" fill="none" stroke="#F87171" stroke-width="1.5" opacity="0.5" />

    <!-- Center Transition Node -->
    <circle cx="160" cy="90" r="3.5" fill="#0B1F3A" opacity="0.4" />
  </g>

  <!-- ELEGANT VERTICAL SEPARATOR -->
  <line x1="330" y1="28" x2="330" y2="152" stroke="rgba(11,31,58,0.18)" stroke-width="1.8" />

  <!-- BRAND TYPOGRAPHY -->
  <g id="brand-text">
    <text x="368" y="98" 
          font-family="'Fraunces', 'Hanken Grotesk', Georgia, serif" 
          font-weight="700" 
          font-size="68" 
          letter-spacing="5" 
          fill="#0B1F3A">STRIKEPOINT</text>

    <text x="372" y="144" 
          font-family="'Hanken Grotesk', system-ui, sans-serif" 
          font-weight="600" 
          font-size="28" 
          letter-spacing="14" 
          fill="#C29B40">VENTURES</text>
  </g>
</svg>
