    <circle cx="120" cy="90" r="58" fill="none" stroke="#C29B40" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="120" cy="90" r="50" fill="none" stroke="#0B1F3A" stroke-width="0.8" opacity="0.3" />
    <!-- 12-Point Guilloche Rosette Petals -->
