<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 180" width="1120" height="180">
  <!-- CONCEPT 5: THE PRECISION COMPASS ROSE & ROMAN SV (LIGHT) -->
  <g id="c5-mark" transform="translate(45, 0)">
    <!-- Concentric Compass Rings -->
    <circle cx="120" cy="90" r="64" fill="none" stroke="#0B1F3A" stroke-width="2.5" />
    <circle cx="120" cy="90" r="56" fill="none" stroke="#C29B40" stroke-width="1.2" stroke-dasharray="2 3" />
    <circle cx="120" cy="90" r="48" fill="none" stroke="#0B1F3A" stroke-width="0.8" opacity="0.3" />

    <!-- 4 Cardinal Strike Needle Points (North, South, East, West) -->
    <!-- North Point -->
    <polygon points="120,20 124,36 120,32 116,36" fill="#C29B40" />
    <!-- South Point -->
    <polygon points="120,160 124,144 120,148 116,144" fill="#C29B40" />
    <!-- East Point -->
    <polygon points="190,90 174,86 178,90 174,94" fill="#C29B40" />
    <!-- West Point -->
    <polygon points="50,90 66,86 62,90 66,94" fill="#C29B40" />

    <!-- Roman Serif 'SV' -->
    <text x="120" y="105" 
          font-family="'Cinzel', 'Fraunces', Georgia, serif" 
          font-weight="700" 
          font-size="46" 
          letter-spacing="3" 
          fill="#0B1F3A" 
          text-anchor="middle">SV</text>

    <!-- Center Precision Diamond -->
    <polygon points="120,116 123,121 120,126 117,121" fill="#C29B40" />
  </g>

  <!-- VERTICAL SEPARATOR -->
  <line x1="335" y1="28" x2="335" y2="152" stroke="rgba(11,31,58,0.18)" stroke-width="1.8" stroke-linecap="round" />

  <!-- BRAND TYPOGRAPHY -->
  <g id="brand-text">
    <text x="375" y="98" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="66" letter-spacing="4.5" fill="#0B1F3A">STRIKEPOINT</text>
    <text x="380" y="144" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" letter-spacing="14" fill="#C29B40">VENTURES</text>
  </g>
</svg>
