<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 180" width="1120" height="180">
  <!-- CONCEPT 4: THE CLASSICAL CAPITAL PILLAR (LIGHT) -->
  <g id="c4-mark" transform="translate(45, 0)">
    <!-- Column Pediment / Capital Header (T Bar) -->
    <path d="M 60 44 H 180 V 54 H 60 Z" fill="#0B1F3A" />
    <path d="M 70 54 H 170 V 60 H 70 Z" fill="#C29B40" />

    <!-- Left Ionic Scroll (S formation) -->
    <path d="M 96 66 C 72 66, 64 80, 72 94 C 80 108, 98 106, 98 118 C 98 128, 86 132, 74 128" 
          fill="none" 
          stroke="#0B1F3A" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <!-- Central Fluted Pillar Stem (T Column) -->
    <line x1="110" y1="64" x2="110" y2="136" stroke="#0B1F3A" stroke-width="4" />
    <line x1="120" y1="64" x2="120" y2="136" stroke="#C29B40" stroke-width="4.5" />
    <line x1="130" y1="64" x2="130" y2="136" stroke="#0B1F3A" stroke-width="4" />

    <!-- Right Ionic Scroll (P formation) -->
    <path d="M 136 66 H 162 C 178 66, 178 98, 162 98 H 136 V 128" 
          fill="none" 
          stroke="#0B1F3A" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <!-- Column Base Plinth -->
    <path d="M 68 136 H 172 V 144 H 68 Z" fill="#C29B40" />
    <path d="M 58 144 H 182 V 152 H 58 Z" fill="#0B1F3A" />
  </g>

  <!-- VERTICAL SEPARATOR -->
  <line x1="335" y1="28" x2="335" y2="152" stroke="rgba(11,31,58,0.18)" stroke-width="1.8" stroke-linecap="round" />

  <!-- BRAND TYPOGRAPHY -->
  <g id="brand-text">
    <text x="375" y="98" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="66" letter-spacing="4.5" fill="#0B1F3A">STRIKEPOINT</text>
    <text x="380" y="144" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" letter-spacing="14" fill="#C29B40">VENTURES</text>
  </g>
</svg>
