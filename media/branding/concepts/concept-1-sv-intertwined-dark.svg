<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 180" width="1120" height="180">
  <defs>
    <linearGradient id="c1GoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E296" />
      <stop offset="50%" stop-color="#D7B231" />
      <stop offset="100%" stop-color="#A88314" />
    </linearGradient>
  </defs>

  <!-- CONCEPT 1: THE INTERTWINED ROMAN SV (DARK) -->
  <g id="c1-mark-dark" transform="translate(45, 0)">
    <polygon points="120,18 192,48 192,132 120,162 48,132 48,48" fill="none" stroke="rgba(215,178,49,0.4)" stroke-width="1.8" />
    <polygon points="120,24 186,52 186,128 120,156 54,128 54,52" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 3" />
    <polygon points="120,10 125,18 120,26 115,18" fill="#D7B231" />

    <!-- Roman 'V' (Pure White) -->
    <path d="M 80 50 L 120 140 L 160 50" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="70" y1="50" x2="90" y2="50" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="150" y1="50" x2="170" y2="50" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

    <!-- Intertwined Roman 'S' (Rich Brass Gold) -->
    <path d="M 152 68 C 145 46, 96 44, 96 72 C 96 106, 146 102, 146 132 C 146 156, 94 154, 88 132" 
          fill="none" 
          stroke="url(#c1GoldDark)" 
          stroke-width="9" 
          stroke-linecap="round" />
  </g>

  <!-- VERTICAL SEPARATOR -->
  <line x1="335" y1="28" x2="335" y2="152" stroke="rgba(255,255,255,0.2)" stroke-width="1.8" stroke-linecap="round" />

  <!-- BRAND TYPOGRAPHY -->
  <g id="brand-text-dark">
    <text x="375" y="98" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="66" letter-spacing="4.5" fill="#FFFFFF">STRIKEPOINT</text>
    <text x="380" y="144" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" letter-spacing="14" fill="#D7B231">VENTURES</text>
  </g>
</svg>
