<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 180" width="1120" height="180">
  <!-- CONCEPT 2: THE SOVEREIGN STP MONOGRAM (LIGHT) -->
  <g id="c2-mark" transform="translate(40, 0)">
    <!-- Circular Perimeter Ring -->
    <circle cx="120" cy="90" r="66" fill="none" stroke="#0B1F3A" stroke-width="2.5" />
    <circle cx="120" cy="90" r="60" fill="none" stroke="#C29B40" stroke-width="1.2" stroke-dasharray="4 3" />
    
    <!-- Central Authority 'T' -->
    <path d="M 75 58 H 165 M 120 58 V 132" stroke="#0B1F3A" stroke-width="10" stroke-linecap="square" />
    <!-- Serifs on T -->
    <line x1="106" y1="132" x2="134" y2="132" stroke="#0B1F3A" stroke-width="5" stroke-linecap="round" />

    <!-- Left Flanking 'S' -->
    <path d="M 100 70 C 84 70, 70 74, 70 88 C 70 105, 102 102, 102 116 C 102 127, 85 128, 74 126" 
          fill="none" 
          stroke="#C29B40" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- Right Flanking 'P' -->
    <path d="M 138 70 H 158 C 174 70, 174 100, 158 100 H 138 V 126" 
          fill="none" 
          stroke="#C29B40" 
          stroke-width="6" 
          stroke-linecap="round" />
  </g>

  <!-- VERTICAL SEPARATOR -->
  <line x1="335" y1="28" x2="335" y2="152" stroke="rgba(11,31,58,0.18)" stroke-width="1.8" stroke-linecap="round" />

  <!-- BRAND TYPOGRAPHY -->
  <g id="brand-text">
    <text x="375" y="98" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="66" letter-spacing="4.5" fill="#0B1F3A">STRIKEPOINT</text>
    <text x="380" y="144" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" letter-spacing="14" fill="#C29B40">VENTURES</text>
  </g>
</svg>
