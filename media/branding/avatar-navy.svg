<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="crestFav" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>
    <linearGradient id="troughFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3860" />
      <stop offset="100%" stop-color="#FF1361" />
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00F5A0" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0B1F3A" />
  <!-- Green crest -->
  <path d="M 16 60 C 33 20, 47 20, 60 60" fill="none" stroke="url(#crestFav)" stroke-width="7" stroke-linecap="round" />
  <!-- Red trough -->
  <path d="M 60 60 C 73 100, 87 100, 104 60" fill="none" stroke="url(#troughFav)" stroke-width="7" stroke-linecap="round" />
  <!-- Traveling live energy dot -->
  <circle r="4.5" fill="#FFFFFF" filter="url(#fGlow)">
    <animateMotion path="M 16 60 C 33 20, 47 20, 60 60 C 73 100, 87 100, 104 60" dur="2.4s" repeatCount="indefinite" />
  </circle>
</svg>